name = "chumi-cron-worker"
main = "index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = [
  "*/30 * * * *",  # streaks + cleanup — каждые 30 минут
  "0 18 * * *",    # напоминания — раз в день, 18:00 UTC (21:00 МСК)
  "0 9 * * *",     # админ-сводка — раз в день, 9:00 UTC (12:00 МСК)
  "0 4 * * *"      # чистка открыток — раз в день, 4:00 UTC
]
